name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NOOKIT_GITHUB_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare runtime and icons
        run: node scripts/prepare.mjs
      - name: Check Rust application
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
